services:
  gt7-datalogger:
    # `up` builds locally if this tag isn't present; `docker compose pull` fetches
    # the published image instead. `up --build` always rebuilds from source.
    image: ghcr.io/jbhoorasingh/gt7-datalogger:latest
    build: .
    container_name: gt7-datalogger
    restart: unless-stopped
    ports:
      - "8000:8000"        # web dashboard + API
      - "33740:33740/udp"  # GT7 telemetry stream
    environment:
      # IP of the PlayStation running GT7. Leave unset for broadcast
      # auto-discovery (requires host networking on Linux; see README).
      - GT7_PS_IP=${GT7_PS_IP:-}
      # Set to "sim" to demo without a PlayStation.
      - GT7_SOURCE=${GT7_SOURCE:-udp}
      # Lossless encrypted receive-boundary archives for parser/replay work.
      - GT7_RAW_ARCHIVE=${GT7_RAW_ARCHIVE:-true}
    volumes:
      - gt7-data:/data
      - gt7-metrics:/metrics

  grafana:
    profiles: ["grafana"]
    image: grafana/grafana-oss:13.1.1
    container_name: gt7-grafana
    restart: unless-stopped
    depends_on:
      - gt7-datalogger
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_PLUGINS_PREINSTALL_SYNC=frser-sqlite-datasource@4.0.6
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - gt7-metrics:/var/lib/gt7-metrics:ro
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  gt7-data:
  gt7-metrics:
  grafana-data:
