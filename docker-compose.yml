services:
  gt7-datalogger:
    # `up` builds locally if this tag isn't present; `docker compose pull` fetches
    # the published image instead. `up --build` always rebuilds from source.
    image: ghcr.io/jbhoorasingh/gt7-datalogger:latest
    build: .
    container_name: gt7-datalogger
    restart: unless-stopped
    ports:
      - "8000:8000"        # web dashboard + API
      - "33740:33740/udp"  # GT7 telemetry stream
    environment:
      # IP of the PlayStation running GT7. Leave unset for broadcast
      # auto-discovery (requires host networking on Linux; see README).
      - GT7_PS_IP=${GT7_PS_IP:-}
      # Set to "sim" to demo without a PlayStation.
      - GT7_SOURCE=${GT7_SOURCE:-udp}
      # Lossless decrypted packet archives for future parser/replay work.
      - GT7_RAW_ARCHIVE=${GT7_RAW_ARCHIVE:-true}
    volumes:
      - gt7-data:/data

volumes:
  gt7-data:
